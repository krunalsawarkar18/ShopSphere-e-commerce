<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | ShopSphere</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <div data-header></div>
    <main class="shell py-6 sm:py-8">
      <section class="promo-card p-6 sm:p-8">
        <p class="eyebrow">Contact</p>
        <h1 class="mt-3 text-4xl sm:text-5xl">We’re here if you need help.</h1>
        <p class="mt-4 max-w-3xl text-base leading-8 text-slate">
          This is a dummy contact page for the website. It includes sample support channels and a demo enquiry form.
        </p>
      </section>

      <section class="mt-8 grid gap-6 lg:grid-cols-[0.9fr_1.1fr]">
        <article class="summary-card">
          <p class="eyebrow">Support channels</p>
          <div class="mt-5 space-y-4">
            <div class="dashboard-tile">
              <h2 class="text-xl text-ink">Email</h2>
              <p class="mt-2 text-sm leading-7 text-slate">support@shopsphere.demo</p>
            </div>
            <div class="dashboard-tile">
              <h2 class="text-xl text-ink">Phone</h2>
              <p class="mt-2 text-sm leading-7 text-slate">+91 00000 00000</p>
            </div>
            <div class="dashboard-tile">
              <h2 class="text-xl text-ink">Hours</h2>
              <p class="mt-2 text-sm leading-7 text-slate">Monday to Saturday, 9:00 AM to 7:00 PM</p>
            </div>
          </div>
        </article>

        <article class="summary-card">
          <p class="eyebrow">Send a message</p>
          <div class="mt-5 grid gap-4">
            <input class="field" type="text" placeholder="Your name" />
            <input class="field" type="email" placeholder="Email address" />
            <input class="field" type="text" placeholder="Subject" />
            <textarea class="field min-h-[160px] resize-none" placeholder="Write your message"></textarea>
            <button class="btn-primary w-fit" type="button">Send enquiry</button>
          </div>
        </article>
      </section>
    </main>
    <div data-footer></div>
    <script type="module" src="/assets/js/pages/site-info.js"></script>
  </body>
</html>
