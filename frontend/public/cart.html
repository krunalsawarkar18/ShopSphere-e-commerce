<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your cart | ShopSphere</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <div data-header></div>
    <main class="shell py-6 sm:py-10">
      <section class="promo-card p-6 sm:p-8">
        <div class="section-head">
          <div>
            <p class="eyebrow">Cart</p>
            <h1 class="mt-2 text-3xl sm:text-5xl">Your bag</h1>
          </div>
          <a class="chip-link w-full justify-center sm:w-auto" href="/home.html">Continue shopping</a>
        </div>
        <div class="mt-6 flex flex-wrap gap-3">
          <span class="ghost-tag">Update quantity</span>
          <span class="ghost-tag">Remove anytime</span>
          <span class="ghost-tag">Checkout in one step</span>
        </div>
      </section>
      <p id="page-message" class="mb-5 mt-6 hidden rounded-2xl px-4 py-3 text-sm"></p>
      <section class="mt-6 grid gap-6 lg:grid-cols-[1.3fr_0.7fr]">
        <div id="cart-items" class="space-y-4"></div>
        <aside id="cart-summary" class="summary-card h-fit"></aside>
      </section>
    </main>
    <div data-footer></div>
    <script type="module" src="/assets/js/pages/cart.js"></script>
  </body>
</html>
