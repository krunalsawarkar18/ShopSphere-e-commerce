<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | ShopSphere</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <div data-header></div>
    <main class="shell py-5 sm:py-8">
      <section class="promo-card p-6 sm:p-8">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p class="eyebrow">Customer profile</p>
            <h1 class="mt-2 text-3xl sm:text-5xl">Your account</h1>
          </div>
          <a class="chip-link w-full justify-center sm:w-auto" href="/orders.html">View orders</a>
        </div>
      </section>
      <p id="page-message" class="mt-5 hidden rounded-2xl px-4 py-3 text-sm"></p>
      <section class="mt-6 grid gap-6 lg:grid-cols-[0.9fr_1.1fr]">
        <article id="profile-card" class="summary-card p-6"></article>
        <div class="space-y-6">
          <article id="profile-address" class="summary-card p-6"></article>
          <article id="profile-stats" class="summary-card p-6"></article>
          <article id="profile-orders" class="summary-card p-6"></article>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <script type="module" src="/assets/js/pages/profile.js"></script>
  </body>
</html>
